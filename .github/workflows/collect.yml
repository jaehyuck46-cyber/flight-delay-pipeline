name: 김포공항 항공편 수집

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# backfill.yml과 같은 그룹을 걸어서, 두 워크플로가 동시에 DB를 커밋하다
# 충돌하지 않도록 한다 (먼저 시작한 쪽이 끝날 때까지 뒤는 대기).
concurrency:
  group: db-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install requests python-dotenv

      # ── 수집 3종 — 서로 독립. 앞이 실패해도 뒤는 그대로 실행됨 ──
      - name: 데이터 수집 실행
        if: always()
        env:
          KAC_SERVICE_KEY: ${{ secrets.KAC_SERVICE_KEY }}
        run: python collect.py

      - name: 날씨 수집 실행
        if: always()
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python weather.py

      - name: 항공기 위치 수집 실행
        if: always()
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python track.py

      - name: 대시보드 JSON 생성
        if: always()
        continue-on-error: true
        run: python export_dashboard.py

      # ── 매 실행마다 커밋 (DB + 대시보드 JSON). 수집이 전부 실패해도 JSON의 health가 stale로 갱신되도록 ──
      - name: 수집한 DB를 저장소에 커밋
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f data/flights.db docs/data/dashboard.json
          git commit -m "자동 수집 (항공편+날씨+항공기위치+대시보드)" || echo "변경사항 없음"
          git push