<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김포공항 도착편 지연 분석</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color:#222; }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.1rem; margin-top: 0; }
  .meta { color: #666; font-size: 0.9rem; margin-bottom: 32px; }
  .card { margin-bottom: 48px; }
</style>
</head>
<body>
  <h1>김포공항(GMP) 도착편 지연 분석</h1>
  <p class="meta">대상: 도착 완료편 2183건 · 생성 2026-09-10 14:39</p>

  <div class="card">
    <h2>항공사별 15분 지연율 (20편 이상)</h2>
    <canvas id="airlineChart"></canvas>
  </div>

  <div class="card">
    <h2>시간대별 15분 지연율</h2>
    <canvas id="hourChart"></canvas>
  </div>

<script>
  const airlineLabels = ["이스타항공", "제주항공", "진에어", "대한항공", "에어서울", "티웨이항공", "아시아나항공", "파라타항공", "에어부산", "일본항공", "피치항공", "전일본공수", "섬에어"];
  const airlineValues = [30.7, 21.9, 19.2, 12.7, 12.5, 10.7, 10.5, 8.7, 7.5, 7.3, 5.3, 5.1, 4.2];
  const hourLabels = ["07시", "08시", "09시", "10시", "11시", "12시", "13시", "14시", "15시", "16시", "17시", "18시", "19시", "20시", "21시", "22시"];
  const hourValues = [2.8, 0.0, 6.2, 11.0, 10.3, 5.5, 9.8, 28.6, 19.0, 17.5, 20.6, 28.2, 19.6, 12.6, 11.7, 18.1];

  new Chart(document.getElementById('airlineChart'), {
    type: 'bar',
    data: { labels: airlineLabels,
            datasets: [{ label: '15분 지연율(%)', data: airlineValues }] },
    options: { scales: { y: { beginAtZero: true } } }
  });

  new Chart(document.getElementById('hourChart'), {
    type: 'bar',
    data: { labels: hourLabels,
            datasets: [{ label: '15분 지연율(%)', data: hourValues }] },
    options: { scales: { y: { beginAtZero: true } } }
  });
</script>
</body>
</html>
