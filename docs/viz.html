<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김포공항 도착편 지연 분석</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color:#222; }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.1rem; margin-top: 0; }
  .meta { color: #666; font-size: 0.9rem; margin-bottom: 32px; }
  .card { margin-bottom: 48px; }
</style>
</head>
<body>
  <h1>김포공항(GMP) 도착편 지연 분석</h1>
  <p class="meta">대상: 도착 완료편 15813건 · 생성 2026-11-23 15:42</p>

  <div class="card">
    <h2>항공사별 15분 지연율 (20편 이상)</h2>
    <canvas id="airlineChart"></canvas>
  </div>

  <div class="card">
    <h2>시간대별 15분 지연율</h2>
    <canvas id="hourChart"></canvas>
  </div>

<script>
  const airlineLabels = ["에어서울", "이스타항공", "상해항공", "진에어", "제주항공", "트리니티항공", "파라타항공", "대한항공", "중국동방항공", "타이거에어 타이완", "아시아나항공", "일본항공", "에어부산", "티웨이항공", "피치항공", "전일본공수", "중국국제항공", "섬에어", "에바항공", "중국남방항공", "중화항공"];
  const airlineValues = [30.2, 26.2, 25.6, 22.7, 22.2, 14.2, 14.1, 12.3, 11.1, 10.0, 9.5, 8.5, 8.3, 8.3, 5.0, 4.1, 2.3, 2.3, 2.0, 0.0, 0.0];
  const hourLabels = ["07시", "08시", "09시", "10시", "11시", "12시", "13시", "14시", "15시", "16시", "17시", "18시", "19시", "20시", "21시", "22시"];
  const hourValues = [0.9, 4.5, 4.9, 8.1, 9.9, 9.4, 15.9, 20.9, 23.5, 16.2, 19.3, 22.9, 21.3, 16.4, 13.7, 17.9];

  new Chart(document.getElementById('airlineChart'), {
    type: 'bar',
    data: { labels: airlineLabels,
            datasets: [{ label: '15분 지연율(%)', data: airlineValues }] },
    options: { scales: { y: { beginAtZero: true } } }
  });

  new Chart(document.getElementById('hourChart'), {
    type: 'bar',
    data: { labels: hourLabels,
            datasets: [{ label: '15분 지연율(%)', data: hourValues }] },
    options: { scales: { y: { beginAtZero: true } } }
  });
</script>
</body>
</html>
