<svg viewBox="0 0 720 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ============ 데이터 소스 (상단) ============ -->
  <!-- 소스 A -->
  <g filter="url(#shadow)">
    <rect x="92" y="34" width="236" height="74" rx="13" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="210" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">🛫 한국공항공사 API</text>
  <text x="210" y="88" text-anchor="middle" font-size="12.5" fill="#3B5A80">실시간 도착편 스냅샷</text>

  <!-- 소스 B -->
  <g filter="url(#shadow)">
    <rect x="392" y="34" width="236" height="74" rx="13" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="510" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">🌦️ 기상청 API</text>
  <text x="510" y="88" text-anchor="middle" font-size="12.5" fill="#3B5A80">김포공항 날씨</text>

  <!-- 소스 → 수집 화살표 -->
  <path d="M210,108 L210,168" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M510,108 L510,168" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ CRON 박스 ============ -->
  <rect x="48" y="150" width="624" height="446" rx="20" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 6"/>
  <!-- 박스 라벨 pill -->
  <g filter="url(#shadow)">
    <rect x="188" y="134" width="344" height="34" rx="17" fill="#0F172A"/>
  </g>
  <text x="360" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="#F8FAFC">⏰ GitHub Actions cron · 30분 주기 자동 실행</text>

  <!-- ============ 수집 스크립트 ============ -->
  <!-- collect.py -->
  <g filter="url(#shadow)">
    <rect x="92" y="182" width="236" height="72" rx="13" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="210" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">collect.py</text>
  <text x="210" y="234" text-anchor="middle" font-size="12.5" fill="#64748B">수집 · 필터 · UPSERT</text>

  <!-- weather.py -->
  <g filter="url(#shadow)">
    <rect x="392" y="182" width="236" height="72" rx="13" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="510" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">weather.py</text>
  <text x="510" y="234" text-anchor="middle" font-size="12.5" fill="#64748B">발표시각 계산 · 파싱</text>

  <!-- 수집 → DB 화살표 -->
  <path d="M210,254 L318,332" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M510,254 L402,332" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ SQLite DB (실린더) ============ -->
  <g filter="url(#shadow)">
    <path d="M224,352 L224,436 A136,20 0 0 0 496,436 L496,352" fill="#CCFBF1" stroke="#0E7C86" stroke-width="2"/>
    <ellipse cx="360" cy="352" rx="136" ry="20" fill="#A7F3E4" stroke="#0E7C86" stroke-width="2"/>
  </g>
  <text x="360" y="356" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0A5A62">🗃️ SQLite · flights.db</text>
  <text x="360" y="392" text-anchor="middle" font-size="12" fill="#0A5A62">flights · flight_events</text>
  <text x="360" y="411" text-anchor="middle" font-size="12" fill="#0A5A62">collection_log · weather</text>

  <!-- DB → 분석 화살표 -->
  <path d="M360,456 L360,500" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 분석 ============ -->
  <g filter="url(#shadow)">
    <rect x="176" y="502" width="368" height="74" rx="13" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="360" y="532" text-anchor="middle" font-size="15" font-weight="700" fill="#7A4E0A" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">analyze.py</text>
  <text x="360" y="554" text-anchor="middle" font-size="12" fill="#92600C">전체 · 항공사별 · 시간대별 · 날씨별 지연율</text>

  <!-- 분석 → 커밋 (점선, 박스 밖으로) -->
  <path d="M360,596 L360,622" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="360" y="644" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">💾 갱신된 flights.db 를 저장소에 자동 커밋 → 데이터 자산 축적</text>
</svg>
