<svg viewBox="0 0 700 470" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#1E293B" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ============ 데이터 소스 (상단) ============ -->
  <g filter="url(#shadow)">
    <rect x="70" y="20" width="250" height="60" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="195" y="46" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1E3A5F">🛫 한국공항공사 API</text>
  <text x="195" y="66" text-anchor="middle" font-size="12" fill="#3B5A80">실시간 도착편 스냅샷</text>

  <g filter="url(#shadow)">
    <rect x="380" y="20" width="250" height="60" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="505" y="46" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1E3A5F">🌦️ 기상청 API</text>
  <text x="505" y="66" text-anchor="middle" font-size="12" fill="#3B5A80">김포공항 날씨</text>

  <path d="M195,80 L195,110" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M505,80 L505,110" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ CRON 박스 ============ -->
  <rect x="36" y="94" width="628" height="326" rx="18" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 6"/>
  <g filter="url(#shadow)">
    <rect x="190" y="78" width="320" height="32" rx="16" fill="#0F172A"/>
  </g>
  <text x="350" y="99" text-anchor="middle" font-size="12.5" font-weight="600" fill="#F8FAFC">⏰ GitHub Actions cron · 30분 주기 자동 실행</text>

  <!-- ============ 수집 스크립트 ============ -->
  <g filter="url(#shadow)">
    <rect x="70" y="114" width="250" height="60" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="195" y="140" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1E293B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">collect.py</text>
  <text x="195" y="160" text-anchor="middle" font-size="12" fill="#64748B">수집 · 필터 · UPSERT</text>

  <g filter="url(#shadow)">
    <rect x="380" y="114" width="250" height="60" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="505" y="140" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1E293B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">weather.py</text>
  <text x="505" y="160" text-anchor="middle" font-size="12" fill="#64748B">발표시각 계산 · 파싱</text>

  <path d="M195,174 L300,208" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M505,174 L400,208" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ SQLite DB (실린더) ============ -->
  <g filter="url(#shadow)">
    <path d="M225,214 L225,292 A125,17 0 0 0 475,292 L475,214" fill="#CCFBF1" stroke="#0E7C86" stroke-width="2"/>
    <ellipse cx="350" cy="214" rx="125" ry="17" fill="#A7F3E4" stroke="#0E7C86" stroke-width="2"/>
  </g>
  <text x="350" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#0A5A62">🗃️ SQLite · flights.db</text>
  <text x="350" y="250" text-anchor="middle" font-size="11.5" fill="#0A5A62">flights · flight_events</text>
  <text x="350" y="268" text-anchor="middle" font-size="11.5" fill="#0A5A62">collection_log · weather</text>

  <path d="M350,309 L350,342" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 분석 ============ -->
  <g filter="url(#shadow)">
    <rect x="175" y="344" width="350" height="60" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="350" y="370" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7A4E0A" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">analyze.py</text>
  <text x="350" y="390" text-anchor="middle" font-size="11.5" fill="#92600C">전체 · 항공사별 · 시간대별 · 날씨별 지연율</text>

  <path d="M350,404 L350,428" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="350" y="452" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">💾 갱신된 flights.db 를 저장소에 자동 커밋 → 데이터 자산 축적</text>
</svg>
